apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: finops-project
  namespace: argocd
spec:
  description: FinOps Cost Optimization System
  sourceRepos:
    - "https://github.com/Ujjwal0022/aws-cost-optimizer"
  destinations:
    - namespace: finops
      server: https://kubernetes.default.svc
    - namespace: monitoring
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "apps"
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: Secret
    - group: "networking.k8s.io"
      kind: Ingress
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
