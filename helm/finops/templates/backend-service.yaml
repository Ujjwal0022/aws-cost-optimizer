apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.backend.name }}-svc
  namespace: {{ .Values.global.namespace }}
  labels:
    app: finops-backend
spec:
  selector:
    app: finops-backend
  ports:
    - port: 8000
      targetPort: {{ .Values.backend.port }}
      name: http
  type: ClusterIP
