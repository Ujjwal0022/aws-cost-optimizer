apiVersion: v1
kind: ConfigMap
metadata:
  name: finops-config
  namespace: {{ .Values.global.namespace }}
data:
  AWS_DEFAULT_REGION: {{ .Values.backend.env.AWS_DEFAULT_REGION | quote }}
  CORS_ORIGINS: {{ .Values.backend.env.CORS_ORIGINS | quote }}
  ENVIRONMENT: {{ .Values.global.environment | quote }}
---
# Secret created manually — do NOT store real values in Git:
# kubectl create secret generic finops-aws-secret \
#   --from-literal=AWS_ACCESS_KEY_ID=... \
#   --from-literal=AWS_SECRET_ACCESS_KEY=... \
#   --from-literal=AWS_ACCOUNT_ID=... \
#   -n finops
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.secretName }}
  namespace: {{ .Values.global.namespace }}
type: Opaque
