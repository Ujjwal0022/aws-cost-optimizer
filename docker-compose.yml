services:
  backend:
    build: ./backend
    container_name: finops-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8000
    container_name: finops-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
